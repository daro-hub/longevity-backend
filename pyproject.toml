[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "UP042", # (str, Enum) kept over StrEnum: identical behavior, more portable idiom
    "B008",  # Depends(...) in a default arg is the standard FastAPI DI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
