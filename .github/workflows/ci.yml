name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts index_docs.py
      - name: Domain engine coverage gate (100%)
        run: pytest tests/domain --cov=app.domain --cov-report=term-missing --cov-fail-under=100
      - name: Full test suite
        run: pytest tests -m "not integration"
